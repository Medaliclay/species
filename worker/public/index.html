<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Species ID</title>
<style>
  :root {
    --bg: #f4f6f1; --card: #ffffff; --ink: #18221b; --muted: #5d6b61; --line: #dde3da;
    --accent: #2f7d4f; --accent-soft: #e3f1e8; --warn: #b5651d; --warn-soft: #fbeedd;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1511; --card: #18201b; --ink: #e8efe9; --muted: #9aaa9f; --line: #2a352e;
            --accent: #5cc58a; --accent-soft: #1d3326; --warn: #f0a35b; --warn-soft: #3a2a1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .drop { display: grid; place-items: center; gap: 8px; text-align: center; cursor: pointer;
          border: 2px dashed var(--line); border-radius: 16px; padding: 28px 16px; background: var(--card); }
  .drop:hover { border-color: var(--accent); }
  .drop img { max-width: 100%; max-height: 320px; border-radius: 12px; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 999px;
         padding: 10px 22px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 14px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 20px; }
  .hero { display: flex; gap: 16px; align-items: flex-start; }
  .hero img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; flex: none; }
  .sci { font-style: italic; font-size: 1.5rem; font-weight: 700; margin: 0; }
  .common { color: var(--muted); margin: 2px 0 10px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 600;
          background: var(--accent-soft); color: var(--accent); margin: 0 6px 6px 0; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  .tax { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 0; }
  .tax dt { color: var(--muted); text-transform: capitalize; }
  .tax dd { margin: 0; }
  .cands li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .cands { list-style: none; padding: 0; margin: 0; }
  .links a { color: var(--accent); margin-right: 14px; font-weight: 600; }
  .err { color: var(--warn); font-weight: 600; }
  .notes { white-space: pre-wrap; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🔬 Species ID</h1>
  <p class="sub">Take or upload a photo of a plant, animal or fungus. BioCLIP 2 identifies it, then GBIF, iNaturalist and Wikipedia supply the science.</p>

  <label class="drop" id="drop">
    <input id="file" type="file" accept="image/*" capture="environment" hidden />
    <img id="preview" hidden alt="" />
    <span id="hint">📷 Tap to take a photo or choose one</span>
  </label>
  <div style="text-align:center"><button class="btn" id="go" disabled>Identify</button></div>

  <div id="out"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let photo = null;

$("file").addEventListener("change", (e) => {
  photo = e.target.files[0];
  if (!photo) return;
  $("preview").src = URL.createObjectURL(photo);
  $("preview").hidden = false;
  $("hint").textContent = "Tap to change photo";
  $("go").disabled = false;
});

$("go").addEventListener("click", async () => {
  if (!photo) return;
  $("go").disabled = true;
  $("go").textContent = "Identifying…";
  $("out").innerHTML = "";
  try {
    const body = new FormData();
    body.append("image", await shrink(photo));
    const res = await fetch("/api/identify", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    render(data);
  } catch (err) {
    $("out").innerHTML = `<div class="card err">⚠️ ${esc(err.message)}</div>`;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Identify";
  }
});

// Phones take 5–12 MB photos; the model only needs 224 px, so send ~1024 px JPEG.
async function shrink(file, max = 1024) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", 0.9));
}

function render(d) {
  const f = d.facts || {};
  const pct = Math.round((d.confidence || 0) * 100);
  const common = f.inaturalist?.commonName || d.candidates?.[0]?.common_name || "";
  const img = f.inaturalist?.photo || f.wikipedia?.image;
  const tax = d.taxonomy || {};

  $("out").innerHTML = `
  <div class="card">
    <div class="hero">
      ${img ? `<img src="${esc(img)}" alt="Reference photo of ${esc(d.identified)}">` : ""}
      <div style="flex:1">
        <p class="sci">${esc(d.identified)}</p>
        <p class="common">${esc(common)}${f.gbif?.scientificName ? ` · <small>${esc(f.gbif.scientificName)}</small>` : ""}</p>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <small>${pct}% confidence at ${d.rank} level · ${esc(d.model.name)} in ${d.model.ms} ms</small>
        <div style="margin-top:10px">
          ${!d.confident ? `<span class="pill warn">Not sure of the exact species — showing genus</span>` : ""}
          ${f.iucn ? `<span class="pill ${["EN","CR","VU"].includes(f.iucn.code) ? "warn" : ""}">IUCN: ${esc(f.iucn.category)}</span>` : ""}
          ${f.inaturalist?.group ? `<span class="pill">${esc(f.inaturalist.group)}</span>` : ""}
        </div>
      </div>
    </div>

    ${d.summary ? `<h3>Study notes (AI, from the facts below)</h3><div class="notes">${esc(d.summary)}</div>` : ""}

    ${f.wikipedia ? `<h3>Description</h3><p>${esc(f.wikipedia.extract)}</p>` : ""}

    ${Object.keys(tax).length ? `<h3>Classification (GBIF)</h3>
      <dl class="tax">${Object.entries(tax).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}

    ${f.gbif ? `<h3>Records worldwide</h3>
      <p><b>${(f.gbif.occurrences ?? 0).toLocaleString()}</b> GBIF occurrence records${
        f.inaturalist ? ` · <b>${(f.inaturalist.observations ?? 0).toLocaleString()}</b> iNaturalist observations` : ""}</p>
      ${f.gbif.topCountries.length ? `<p><small>Most records from: ${f.gbif.topCountries.map(c => `${flag(c.code)} ${c.code} (${c.count.toLocaleString()})`).join(" · ")}</small></p>` : ""}` : ""}

    <h3>Other possibilities</h3>
    <ul class="cands">${(d.candidates || []).map(c =>
      `<li><span><i>${esc(c.species)}</i> ${c.common_name ? `<small>${esc(c.common_name)}</small>` : ""}</span><span>${Math.round(c.score*100)}%</span></li>`).join("")}</ul>

    <h3>Learn more</h3>
    <p class="links">
      ${f.gbif ? `<a href="${f.gbif.url}" target="_blank" rel="noopener">GBIF</a>` : ""}
      ${f.inaturalist ? `<a href="${f.inaturalist.url}" target="_blank" rel="noopener">iNaturalist</a>` : ""}
      ${f.wikipedia?.url ? `<a href="${f.wikipedia.url}" target="_blank" rel="noopener">Wikipedia</a>` : ""}
    </p>
    ${f.inaturalist?.photoCredit ? `<small>Reference photo: ${esc(f.inaturalist.photoCredit)}</small>` : ""}
  </div>`;
}

const flag = (cc) => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt())) : "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
</script>
</body>
</html>
